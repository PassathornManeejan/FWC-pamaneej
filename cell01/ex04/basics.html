<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basics</title>
    <style>
        body {
            background: pink;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: white;
            text-align: center;
        }

        .shops {
            display: flex;
            justify-content: center;
            gap: 30px;
            text-align: center;
        }

        .shop img {
            width: 360px;
            max-width: 42vw;
            height: 220px;
            object-fit: cover;
        }

        hr {
            width: 100%;
            border: 0;
            border-top: 1px solid black;
        }

        .copyright {
            text-align: right;
            font-family: monospace;
            font-style: italic;
            padding: 10px 18px;
        }
    </style>
</head>
<body>
    <!-- Special character included: ! -->
    <h1>Online Shops!</h1>

    <div class="shops">
        <div class="shop">
            <img src="https://placehold.co/600x360/ffffff/111111?text=Amazon" alt="Amazon">
            <div><a href="https://www.amazon.com/">Amazon</a></div>
        </div>
        <div class="shop">
            <img src="https://placehold.co/600x360/ffffff/111111?text=eBay" alt="eBay">
            <div><a href="https://www.ebay.com/">eBay</a></div>
        </div>
    </div>

    <hr>
    <!-- Replace "login" with your real 42 login if required. -->
    <div class="copyright">© login 2026</div>
</body>
</html>
