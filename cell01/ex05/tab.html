<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Two-cell table</title>
</head>
<body>
    <table style="width: 100%; border-collapse: collapse;">
        <tr>
            <!-- Each cell has its own text and color. -->
            <td style="background: #c9cc7f; height: 120px; border: 1px solid #777;">First cell</td>
            <td style="background: #f3b9a3; height: 120px; border: 1px solid #777;">Second cell</td>
        </tr>
    </table>
</body>
</html>
